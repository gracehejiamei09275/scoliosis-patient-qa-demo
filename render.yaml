services:
  - type: web
    name: scoliosis-patient-qa-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m llm_pipeline.public_app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        fromDatabase:
          name: scoliosis-patient-db
          property: connectionString
      - key: AUTH_REQUIRED
        value: "1"
      - key: ADMIN_EMAILS
        value: gracehejiamei@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://gracehejiamei09275.github.io

databases:
  - name: scoliosis-patient-db
    plan: free
    region: singapore
    databaseName: scoliosis_patient_app
    user: scoliosis_patient_app
